# 2026/6/15 Gemini.
# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE take precedence over those specified here.

# 1. メモリ割り当ての最適化
# RAM16GB環境なら2048m（2GB）〜3072m（3GB）。まずは安定の2GB。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 2. 並行ビルドの有効化
# Core 5のマルチコア（Pコア/Eコア）をフル活用してビルドを高速化します。
org.gradle.parallel=true

# 3. 設定キャッシュの有効化
# Gradle 9.x系ではこの機能（Configuration Cache）がほぼ成熟・標準化されています。
org.gradle.configuration-cache=true

# 4. AndroidXの有効化
# Jetifierは完全に不要。
android.useAndroidX=true

# 5. Kotlinのコードスタイル
kotlin.code.style=official